# Publishes the mod to Modrinth when a GitHub release is published.
#
# Setup (once):
#   1. Create the project on Modrinth and copy its ID (project page > "..." menu > Copy ID).
#   2. Create a Modrinth personal access token with the "Create versions" scope
#      (https://modrinth.com/settings/pats).
#   3. In the GitHub repo settings, add the secret MODRINTH_TOKEN and the variable MODRINTH_PROJECT_ID.
#
# Release: bump `version` in gradle.properties, push, then create a GitHub release whose tag is
# `v<version>` (e.g. v0.1.0). The release notes become the Modrinth changelog.

name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modrinth:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: check the tag matches gradle.properties
        if: github.event_name == 'release'
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${{ github.event.release.tag_name }}" != "v${version}" ]; then
            echo "Release tag '${{ github.event.release.tag_name }}' does not match gradle.properties version 'v${version}'"
            exit 1
          fi
      - name: publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-sources.jar
          name: Minecraft MCP ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          version-type: release
          loaders: fabric
          game-versions: 26.3M
          java: 25
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
